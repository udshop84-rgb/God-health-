<!DOCTYPE html>
<html lang="en" style="background-color: #0a0a0a; color: #fafafa;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health is everything</title>
    <script>
      // Automatically redirect 404 subpages back to base root
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      if (repo && window.location.hostname.endsWith('github.io')) {
        window.location.replace('/' + repo + '/');
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body style="background:#0a0a0a;color:#fafafa;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to Health is everything...</p>
  </body>
</html>
